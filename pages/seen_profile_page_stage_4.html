      .modal-close { position: absolute; top: 20px; right: 20px; background: none; border: none; font-size: 28px; cursor: pointer; color: #999; transition: color .3s ease; }
      .modal-close:hover { color: #001f3f; }

      .share-icon { width: 40px; height: 40px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 20px; }

      .hidden { display: none; }
      @keyframes fadeIn { from { opacity: 0; transform: translateY(10px);} to { opacity: 1; transform: translateY(0);} }
      @keyframes slideIn { from { opacity: 0; transform: translateY(20px);} to { opacity: 1; transform: translateY(0);} }
      .fade-in { animation: fadeIn .4s ease; }
      .new-comment { animation: slideIn .4s ease; }
      
      @media (max-width: 1200px) {

      @media (max-width: 768px) {
        .navbar { padding: 15px 20px; }

        .comment-footer { flex-direction: column; align-items: flex-start; gap: 10px; padding-left: 0; }

      function displayCommunities() {
        const grid = document.getElementById('communities-grid');
        grid.innerHTML = '';
        const communityKeys = Object.keys(communities);
        const totalPages = Math.ceil(communityKeys.length / itemsPerPage);

        const startIndex = (currentPage - 1) * itemsPerPage;
        const endIndex = startIndex + itemsPerPage;
        const pageKeys = communityKeys.slice(startIndex, endIndex);

        pageKeys.forEach(key => {
          const comm = communities[key];
          const card = document.createElement('div');
          card.className = 'community-card';
          card.onclick = () => viewCommunity(key);
          card.innerHTML = `
            <div class="community-card-content">
              <div class="community-header">
                <div class="community-icon" style="background:${comm.gradient}">${comm.icon}</div>
                <div class="community-info">
                  <h3>${comm.name.replace(/^.{2}\s/, '')}</h3>
                  <p>${comm.activity}</p>
                </div>
              </div>
              <p class="community-description">${comm.description}</p>
              <div class="community-stats">
                <div class="community-stat"><strong>${comm.stats.split('•')[0].trim()}</strong></div>
                <div class="community-stat"><strong>${comm.stats.split('•')[1].trim()}</strong></div>
              </div>
            </div>
            <button class="btn ${joinedCommunities[key] ? 'btn-joined' : 'btn-join'}" id="${key}-btn" onclick="event.stopPropagation(); joinCommunity('${key}')">${joinedCommunities[key] ? '✓ Joined' : 'Join Community'}</button>
          `;
          grid.appendChild(card);
        });

        document.getElementById('page-info').textContent = `Page ${currentPage} of ${totalPages}`;
        document.getElementById('prev-page-btn').disabled = currentPage === 1;
        document.getElementById('next-page-btn').disabled = currentPage === totalPages;
      }
      
      function nextPage() {
        const totalPages = Math.ceil(Object.keys(communities).length / itemsPerPage);
        if (currentPage < totalPages) {
          currentPage++;
          displayCommunities();
        }
      }

      function prevPage() {
        if (currentPage > 1) {
          currentPage--;
          displayCommunities();
        }
      }

      function joinCommunity(communityId) {
        const btn = document.getElementById(communityId + '-btn');
        joinedCommunities[communityId] = !joinedCommunities[communityId];
        btn.textContent = joinedCommunities[communityId] ? '✓ Joined' : 'Join Community';
        btn.className = 'btn ' + (joinedCommunities[communityId] ? 'btn-joined' : 'btn-join');
      }

      function viewCommunity(communityId) {
        showCommunityPosts(communityId);
      }

      function showCommunityPosts(communityId) {
        currentCommunity = communityId;
        const comm = communities[communityId];
        document.getElementById('community-name').textContent = comm.name;
        document.getElementById('community-stats').textContent = comm.stats;

        const postsContainer = document.getElementById('posts-container');
        postsContainer.innerHTML = '';
        comm.posts.forEach(post => {
          const postCard = document.createElement('div');
          postCard.className = 'post-card';
          postCard.onclick = () => openPost(communityId, post.id);
          
          let badgeClass = '', badgeText = '';
          switch (post.badge) {
              case 'help': badgeClass = 'help-badge'; badgeText = '🆘 Need Help'; break;
              case 'discussion': badgeClass = 'discussion-badge'; badgeText = '💬 Discussion'; break;
              case 'announcement': badgeClass = 'announcement-badge'; badgeText = '📢 Announcement'; break;
          }

          postCard.innerHTML = `
            <div class="${badgeClass}">${badgeText}</div>
            <div class="post-header"><div class="post-user-info"><h4>${post.title}</h4><p class="post-meta">by ${post.author}</p></div></div>
            <div class="post-content">${post.content.substring(0, 100)}...</div>
          `;
          postsContainer.appendChild(postCard);
        });

        document.getElementById('communities-view').classList.add('hidden');
        document.getElementById('community-posts-view').classList.remove('hidden');
        window.scrollTo(0, 0);
      }

      function backToCommunities() {
        document.getElementById('community-posts-view').classList.add('hidden');
        document.getElementById('post-detail-view').classList.add('hidden');
        document.getElementById('communities-view').classList.remove('hidden');
        window.scrollTo(0, 0);
      }

      function openPost(communityId, postId) {
        currentCommunity = communityId;
        currentPost = postId;
        const post = communities[communityId].posts.find(p => p.id === postId);

        if (!postVotes[postId]) postVotes[postId] = { upvoted: false, count: post.upvotes };
        if (!postSaves[postId]) postSaves[postId] = false;

        let badgeClass = '', badgeText = '';
        switch (post.badge) {
            case 'help': badgeClass = 'help-badge'; badgeText = '🆘 Need Help'; break;
            case 'discussion': badgeClass = 'discussion-badge'; badgeText = '💬 Discussion'; break;
            case 'announcement': badgeClass = 'announcement-badge'; badgeText = '📢 Announcement'; break;
        }

        const detailContainer = document.getElementById('post-detail-container');
        detailContainer.innerHTML = `
          <div class="${badgeClass}">${badgeText}</div>
          <h1 class="post-detail-title">${post.title}</h1>
          <p class="post-meta">by ${post.author}</p>
          <div class="post-detail-content">${post.content}</div>
          <div class="post-tags">${post.tags.map(t => `<span class="post-tag">${t}</span>`).join('')}</div>
          <div class="post-actions">
            <button class="action-btn ${postVotes[postId].upvoted ? 'active' : ''}" id="upvote-btn" onclick="toggleUpvote()">⬆️ Upvote (<span id="upvote-count">${postVotes[postId].count}</span>)</button>
            <button class="action-btn" onclick="document.getElementById('comment-text').focus()">💬 Comment</button>
            <button class="action-btn ${postSaves[postId] ? 'active' : ''}" id="save-btn" onclick="toggleSave()">${postSaves[postId] ? '🔖 Saved' : '🔖 Save'}</button>
            <button class="action-btn" onclick="openShareModal()">⋯ Share</button>
          </div>
        `;
        
        renderComments(post);

        document.getElementById('community-posts-view').classList.add('hidden');
        document.getElementById('post-detail-view').classList.remove('hidden');
        window.scrollTo(0, 0);
      }
      
      function backToPosts() {
        document.getElementById('post-detail-view').classList.add('hidden');
        document.getElementById('community-posts-view').classList.remove('hidden');
      }

      function toggleUpvote() {
        const voteData = postVotes[currentPost];
        voteData.upvoted = !voteData.upvoted;
        voteData.count += voteData.upvoted ? 1 : -1;
        document.getElementById('upvote-btn').classList.toggle('active');
        document.getElementById('upvote-count').textContent = voteData.count;
      }

      function toggleSave() {
        postSaves[currentPost] = !postSaves[currentPost];
        const btn = document.getElementById('save-btn');
        btn.classList.toggle('active');
        btn.textContent = postSaves[currentPost] ? '🔖 Saved' : '🔖 Save';
      }

      function openShareModal() {
        const shareList = document.getElementById('share-list');
        shareList.innerHTML = Object.keys(joinedCommunities)
          .filter(k => joinedCommunities[k] && k !== currentCommunity)
          .map(k => {
            const comm = communities[k];
            return `<li class="share-item" onclick="shareToComm('${k}')">
              <div class="share-icon" style="background:${comm.gradient}">${comm.icon}</div>
              <div><strong>${comm.name.replace(/^.{2}\s/, '')}</strong><br><small>${comm.stats.split('•')[0].trim()}</small></div>
            </li>`;
          }).join('') || '<p style="text-align:center;color:#999;">Join a community to share this post!</p>';
        document.getElementById('shareModal').classList.add('active');
      }

      function closeShareModal() { document.getElementById('shareModal').classList.remove('active'); }
      function shareToComm(commKey) { alert(`Post shared to ${communities[commKey].name}!`); closeShareModal(); }

      function updateCharCount() {
        const textarea = document.getElementById('comment-text');
        const count = textarea.value.length;
        document.getElementById('char-count').textContent = `${count} character${count !== 1 ? 's' : ''}`;
        document.getElementById('post-btn').disabled = count === 0;
      }

      function postComment() {
        const textarea = document.getElementById('comment-text');
        const post = communities[currentCommunity].posts.find(p => p.id === currentPost);
        post.comments.unshift({
          id: `c-${Date.now()}`, author: 'Joel Davis', initials: 'JD', avatar: 'linear-gradient(135deg,#001f3f 0%,#003366 100%)',
          role: 'Student', time: 'Just now', content: textarea.value.trim(), upvotes: 0, replies: []
        });
        post.initialComments++;
        renderComments(post);
        textarea.value = '';
        updateCharCount();
        document.getElementById('success-message').classList.remove('hidden');
        setTimeout(() => document.getElementById('success-message').classList.add('hidden'), 3000);
      }

      function showReplyForm(commentId) {
        const existingForm = document.getElementById('reply-form-active');
        if (existingForm) existingForm.remove();
        const container = document.getElementById(`reply-container-${commentId}`);
        container.innerHTML = `
          <div class="reply-form" id="reply-form-active">
            <textarea placeholder="Write a reply..."></textarea>
            <button onclick="postReply('${commentId}')">Post Reply</button>
          </div>`;
        container.querySelector('textarea').focus();
      }

      function postReply(parentCommentId) {
        const textarea = document.getElementById('reply-form-active').querySelector('textarea');
        const post = communities[currentCommunity].posts.find(p => p.id === currentPost);
        const parentComment = findComment(post.comments, parentCommentId);
        parentComment.replies.push({
          id: `c-${Date.now()}`, author: 'Joel Davis', initials: 'JD', avatar: 'linear-gradient(135deg,#001f3f 0%,#003366 100%)',
          role: 'Student', time: 'Just now', content: textarea.value.trim(), upvotes: 0, replies: []
        });
        post.initialComments++;
        renderComments(post);
      }
      
      function deleteComment(commentId) {
        if (!confirm("Are you sure you want to delete this comment?")) return;
        const post = communities[currentCommunity].posts.find(p => p.id === currentPost);
        
        function findAndDelete(comments) {
          for (let i = 0; i < comments.length; i++) {
            if (comments[i].id === commentId) {
              const count = 1 + (comments[i].replies ? countReplies(comments[i].replies) : 0);
              comments.splice(i, 1);
              return count;
            }
            if (comments[i].replies) {
              const deletedCount = findAndDelete(comments[i].replies);
              if (deletedCount) return deletedCount;
            }
          }
          return 0;
        }
        const deletedCount = findAndDelete(post.comments);
        post.initialComments -= deletedCount;
        renderComments(post);
      }
      
      function countReplies(replies) {
          let count = replies.length;
          replies.forEach(reply => {
              if (reply.replies) count += countReplies(reply.replies);
          });
          return count;
      }

      function findComment(comments, commentId) {
        for (const comment of comments) {
          if (comment.id === commentId) return comment;
          if (comment.replies) {
            const found = findComment(comment.replies, commentId);
            if (found) return found;
          }
        }
        return null;
      }

      function ensureCommentMeta(comment, postId) {
        if (!comment.id) comment.id = `${postId}-${Math.random()}`;
        if (!comment.replies) comment.replies = [];
        if (!commentVotes[comment.id]) commentVotes[comment.id] = { upvoted: false, count: comment.upvotes || 0 };
      }

      function toggleCommentUpvote(commentId) {
        const voteData = commentVotes[commentId];
        voteData.upvoted = !voteData.upvoted;
        voteData.count += voteData.upvoted ? 1 : -1;
        document.getElementById(`comment-upvote-btn-${commentId}`).classList.toggle('active');
        document.getElementById(`comment-upvote-count-${commentId}`).textContent = voteData.count;
      }
      
      function createCommentHTML(comment) {
        ensureCommentMeta(comment, currentPost);
        const voteData = commentVotes[comment.id];
        const deleteButton = comment.author === 'Joel Davis' 
            ? `<span class="comment-action comment-action-delete" onclick="deleteComment('${comment.id}')">Delete</span>` 
            : '';
        return `
          <div class="comment-header">
            <div class="comment-avatar" style="background:${comment.avatar}">${comment.initials}</div>
            <div class="comment-user-info"><h4>${comment.author}</h4><p>${comment.role} • ${comment.time}</p></div>
          </div>
          <p class="comment-content">${comment.content}</p>
          <div class="comment-actions">
            <span id="comment-upvote-btn-${comment.id}" class="comment-action ${voteData.upvoted ? 'active' : ''}" onclick="toggleCommentUpvote('${comment.id}')">▲ Upvote (<span id="comment-upvote-count-${comment.id}">${voteData.count}</span>)</span>
            <span class="comment-action" onclick="showReplyForm('${comment.id}')">Reply</span>
            ${deleteButton}
          </div>
          <div id="reply-container-${comment.id}"></div>
        `;
      }

      function renderComments(post) {
          const container = document.getElementById('existing-comments');
          container.innerHTML = '';
          document.getElementById('comments-count').textContent = `Comments (${post.initialComments})`;

          function render(comments, parentElement) {
              comments.forEach(comment => {
                  const card = document.createElement('div');
                  card.className = 'comment-card';
                  if (comment.time === 'Just now') card.classList.add('new-comment');
                  card.innerHTML = createCommentHTML(comment);
                  parentElement.appendChild(card);
                  if (comment.replies && comment.replies.length > 0) {
                      const repliesContainer = document.createElement('div');
                      repliesContainer.className = 'replies-container';
                      card.appendChild(repliesContainer);
                      render(comment.replies, repliesContainer);
                  }
              });
          }
          if(post.comments) {
            render(post.comments, container);
          }
      }

      window.addEventListener('click', (e) => { if (e.target === document.getElementById('shareModal')) closeShareModal(); });
      document.addEventListener('DOMContentLoaded', () => {
          displayCommunities();
      });
    </script>
  </body>
</html>
